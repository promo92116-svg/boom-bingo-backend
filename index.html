    <script>
      // Polyfill for Node.js AsyncLocalStorage in browser environment
      // This prevents errors from @tanstack/start-storage-context
      if (typeof globalThis !== "undefined" && !globalThis.AsyncLocalStorage) {
        class AsyncLocalStorage {
          run(callback) {
            return callback();
          }
          getStore() {
            return undefined;
          }
          enterWith() {}
          exit() {}
          disable() {}
        }
        globalThis.AsyncLocalStorage = AsyncLocalStorage;

        // Also create node:async_hooks compatibility
        if (!globalThis["node:async_hooks"]) {
          globalThis["node:async_hooks"] = { AsyncLocalStorage };
        }
      }
    </script>

  </body>
